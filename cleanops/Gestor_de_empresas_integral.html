      let body = '';

      if (ui.serviceTab === 'resumen') {
        body = '<div class="info-box"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>' + esc(svc.title) + '</b><br><small style="color:var(--muted)">' + (client ? esc(client.name) + ' · ' + esc(client.address) : '—') + '</small></div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span></div><div style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-size:13px"><div>🕐 ' + esc(svc.date) + ' · ' + esc(svc.time) + '</div><div>👤 ' + esc(employee ? employee.name : 'Sin asignar') + '</div><div>🏷️ ' + esc(svc.type) + '</div><div>💶 ' + money(svc.price) + '</div></div></div>';
        if (client && client.notes) body += '<div class="info-box"><b>Notas</b><br>' + esc(client.notes) + '</div>';
        body += '<div class="checkin-box ' + (svc.checkin ? 'done' : '') + '"><b>📍 Check-in</b><br><small>' + (svc.checkin ? fmtDateTime(svc.checkin.at) + (svc.checkin.coords ? ' · ' + Number(svc.checkin.coords.lat).toFixed(4) + ', ' + Number(svc.checkin.coords.lng).toFixed(4) : '') : 'Sin registrar') + '</small></div>';
        body += '<div class="checkin-box ' + (svc.checkout ? 'done' : '') + '"><b>🏁 Check-out</b><br><small>' + (svc.checkout ? fmtDateTime(svc.checkout.at) : 'Sin registrar') + '</small></div>';

        body += '<div class="action-row" style="margin-top:8px">';
        if (canEdit) {
          if (svc.status === 'programado') body += '<button class="btn btn-primary btn-sm" data-action="svc-checkin" data-id="' + svc.id + '">📍 Check-in</button>';
          if (svc.status === 'en_camino' || svc.status === 'programado') body += '<button class="btn btn-primary btn-sm" data-action="svc-start" data-id="' + svc.id + '">▶️ Iniciar</button>';
          if (svc.status === 'iniciado') body += '<button class="btn btn-ok btn-sm" data-action="svc-finalize" data-id="' + svc.id + '">✅ Finalizar</button>';
          if (svc.status === 'finalizado') body += '<button class="btn btn-ok btn-sm" data-action="svc-validate" data-id="' + svc.id + '">⭐ Validar</button>';
          if (svc.status !== 'validado' && svc.status !== 'cancelado') body += '<button class="btn btn-danger btn-sm" data-action="svc-cancel" data-id="' + svc.id + '">✖ Cancelar</button>';
        }
        if (isClient && ['programado', 'en_camino'].includes(svc.status)) body += '<button class="btn btn-warn btn-sm" data-action="reschedule" data-id="' + svc.id + '">📅 Reprogramar</button>';
        if (canEdit) body += '<button class="btn btn-ghost btn-sm" data-action="edit-service" data-id="' + svc.id + '">✏️ Editar</button>';
        if (isAdmin) body += '<button class="btn btn-ok btn-sm" data-action="invoice-from-service" data-id="' + svc.id + '">💶 Facturar</button>';
        if (isAdmin) body += '<button class="btn btn-danger btn-sm" data-action="delete-service" data-id="' + svc.id + '">🗑</button>';
        body += '<button class="btn btn-warn btn-sm" data-action="new-incident-from-service" data-id="' + svc.id + '">⚠️ Incidencia</button>';
        if (client && client.email) body += '<a class="btn btn-ghost btn-sm" href="mailto:' + esc(client.email) + '?subject=' + encodeURIComponent('Servicio ' + svc.title + ' - ' + svc.date) + '">✉ Email</a>';
        if (employee && employee.whatsapp) body += '<a class="btn btn-whatsapp btn-sm" href="https://wa.me/' + esc(employee.whatsapp.replace(/\D/g, '')) + '?text=' + encodeURIComponent('Hola, consulta sobre el servicio ' + svc.title + ' del ' + svc.date) + '" target="_blank">💬 WhatsApp</a>';
        body += '</div>';
      } else if (ui.serviceTab === 'checkin') {
        body = '<div class="info-box"><b>Control de asistencia GPS</b><br>Registra la ubicación real en el punto de servicio.</div>';
        body += '<div class="checkin-box ' + (svc.checkin ? 'done' : '') + '"><b>📍 Check-in</b><br><small>' + (svc.checkin ? fmtDateTime(svc.checkin.at) + (svc.checkin.coords ? '<br>Lat: ' + Number(svc.checkin.coords.lat).toFixed(5) + ', Lng: ' + Number(svc.checkin.coords.lng).toFixed(5) : '') : 'Sin registrar') + '</small>' + (canEdit && !svc.checkin ? '<div style="margin-top:8px"><button class="btn btn-primary btn-sm" data-action="svc-checkin" data-id="' + svc.id + '">Registrar</button></div>' : '') + '</div>';
        body += '<div class="checkin-box ' + (svc.checkout ? 'done' : '') + '"><b>🏁 Check-out</b><br><small>' + (svc.checkout ? fmtDateTime(svc.checkout.at) : 'Sin registrar') + '</small>' + (canEdit && svc.checkin && !svc.checkout ? '<div style="margin-top:8px"><button class="btn btn-ok btn-sm" data-action="svc-checkout" data-id="' + svc.id + '">Registrar</button></div>' : '') + '</div>';
        if (client && client.address) body += '<div class="info-box"><b>Dirección</b><br>' + esc(client.address) + '<br><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(client.address) + '" target="_blank" style="color:var(--primary);font-weight:700">🗺️ Abrir en Maps</a></div>';
      } else if (ui.serviceTab === 'tasks') {
        const tasks = svc.tasks || [];
        body = '<div style="display:flex;flex-direction:column;gap:8px">';
        if (!tasks.length) body += '<div class="empty-note">Sin tareas.</div>';
        tasks.forEach(t => { body += '<div class="task ' + (t.done ? 'done' : '') + '"><input type="checkbox" data-action="toggle-task" data-service="' + svc.id + '" data-task="' + t.id + '" ' + (t.done ? 'checked' : '') + ' ' + (!canEdit ? 'disabled' : '') + '><span>' + esc(t.name) + '</span>' + (canEdit ? '<button class="btn btn-danger btn-sm" data-action="remove-task" data-service="' + svc.id + '" data-task="' + t.id + '">✕</button>' : '') + '</div>'; });
        body += '</div>';
        if (canEdit) body += '<form data-form="add-task" data-service="' + svc.id + '" style="display:flex;gap:8px;margin-top:14px"><input name="name" placeholder="Nueva tarea..." required style="flex:1"><button class="btn btn-primary" type="submit">Añadir</button></form>';
      } else if (ui.serviceTab === 'evidence') {
        const evidence = svc.evidence || [];
        body = '<div class="info-box"><b>Fotos de evidencia</b><br>Máximo 6 fotos.</div>';
        if (canEdit && evidence.length < 6) body += '<label class="btn btn-primary" style="display:inline-flex;cursor:pointer;margin-bottom:12px">📷 Añadir foto<input type="file" accept="image/*" capture="environment" data-action="add-evidence" data-id="' + svc.id + '" style="display:none"></label>';
        body += '<div class="evidence-grid">';
        if (!evidence.length) body += '<div class="empty-note">Aún no hay fotos.</div>';
        evidence.forEach(ev => { body += '<div class="evidence-item"><img src="' + ev.data + '"><small style="position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:6px;font-size:10px">' + fmtDateTime(ev.at) + '</small>' + (canEdit ? '<button class="evidence-remove" data-action="remove-evidence" data-service="' + svc.id + '" data-evidence="' + ev.id + '">✕</button>' : '') + '</div>'; });
        body += '</div>';
      } else if (ui.serviceTab === 'signature') {
        body = '<div class="info-box"><b>Firma del cliente</b><br>Confirma la aceptación del servicio.</div>';
        if (svc.signature && svc.signature.data) {
          body += '<div style="text-align:center;padding:12px;background:#fff;border-radius:12px;border:1px solid var(--line)"><img src="' + svc.signature.data + '" style="max-width:100%;max-height:200px"><div style="margin-top:8px;font-size:12px;color:var(--muted)">' + esc(svc.signature.by) + ' · ' + fmtDateTime(svc.signature.at) + '</div></div>';
          if (canEdit) body += '<div style="text-align:right;margin-top:8px"><button class="btn btn-danger btn-sm" data-action="clear-signature" data-id="' + svc.id + '">Borrar</button></div>';
        } else if (canEdit || isClient) {
          body += '<div style="text-align:center"><canvas class="signature-pad" id="signature-canvas" width="480" height="200"></canvas><div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><button class="btn btn-ghost" data-action="clear-signature-canvas">Limpiar</button><button class="btn btn-primary" data-action="save-signature" data-id="' + svc.id + '">Guardar firma</button></div></div>';
        } else { body += '<div class="empty-note">Sin firma.</div>'; }
      } else if (ui.serviceTab === 'chat') {
        const messages = api.messagesOf(svc.id);
        body = '<div class="chat" id="chat-box">';
        if (!messages.length) body += '<div class="empty-note">Inicia la conversación.</div>';
        messages.forEach(m => {
          const mine = m.fromId === user.userId;
          body += '<div class="msg ' + (mine ? 'mine' : '') + '"><span class="who">' + esc(m.fromName) + ' · ' + esc(m.fromRole) + '</span>' + (m.text ? esc(m.text) : '') + (m.attachments && m.attachments.length ? '<div class="msg-attach">' + m.attachments.map(a => '<img src="' + a.data + '">').join('') + '</div>' : '') + '<small>' + fmtDateTime(m.date) + '</small></div>';
        });
        body += '</div><form data-form="send-message" data-service="' + svc.id + '" class="chat-input"><input type="file" accept="image/*" id="chat-attach-' + svc.id + '" data-attach-input="' + svc.id + '"><label for="chat-attach-' + svc.id + '" class="file-label">📎</label><input name="text" placeholder="Escribe un mensaje..." style="flex:1"><button class="btn btn-primary">➤</button></form><div id="chat-attach-preview-' + svc.id + '" style="margin-top:6px;font-size:12px;color:var(--muted)"></div>';
      } else if (ui.serviceTab === 'qr') {
        body = '<div class="info-box"><b>QR del servicio</b><br>Escanea para validar presencia.</div><div class="qr-wrap"><canvas id="qr-canvas"></canvas></div><div style="text-align:center;margin-top:10px;font-size:12px;color:var(--muted)">' + esc(svc.id) + '<br>' + esc(svc.title) + ' · ' + esc(svc.date) + ' ' + esc(svc.time) + '</div>';
      }

      return '<h2 id="modal-title">' + esc(svc.title) + '</h2><div class="tabs">' + tabs.map(t => '<button type="button" class="tab-btn ' + (ui.serviceTab === t.id ? 'active' : '') + '" data-action="svc-tab" data-tab="' + t.id + '">' + t.label + '</button>').join('') + '</div>' + body;
    }

    function incidentDetailHTML(inc) {
      const svc = api.get('services', inc.serviceId);
      const client = svc ? api.getClient(svc.clientId) : null;
      const responsible = inc.responsibleId ? api.getEmployee(inc.responsibleId) : null;
      const st = INCIDENT_STATUS[inc.status];
      const pri = INCIDENT_PRI[inc.priority];
      const sla = api.slaInfo(inc);
      const user = api.getUser();
      const isAdmin = ['admin', 'manager'].includes(user.role);
      let employees = []; try { employees = api.list('employees'); } catch (e) {}

      let html = '<h2 id="modal-title">⚠️ ' + esc(inc.type) + '</h2>';
      html += '<div class="info-box"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><span class="status-pill" style="background:#fee2e2;color:#b91c1c">' + pri[0] + '</span></div><b>' + (svc ? esc(svc.title) : '—') + '</b><br><small>' + (client ? esc(client.name) : '—') + '</small><div style="margin-top:8px">👤 ' + esc(responsible ? responsible.name : 'Sin asignar') + '</div><div>Creada por: ' + esc(inc.createdBy) + ' · ' + fmtDateTime(inc.createdAt) + '</div></div>';
      if (sla) html += '<div class="sla-bar ' + sla.kind + '">' + (sla.kind === 'ok' ? '✅ ' : sla.kind === 'warn' ? '⚠️ ' : '⏰ ') + esc(sla.label) + (isFinite(sla.hoursLeft) ? ' · ' + Math.max(0, Math.round(sla.hoursLeft)) + 'h' : '') + '</div>';
      html += '<div class="field"><label>Descripción</label><div style="background:#f8fafc;padding:12px;border-radius:10px;font-size:13px">' + esc(inc.description) + '</div></div>';
      if (isAdmin) {
        html += '<form data-form="incident-update" data-id="' + inc.id + '" class="form-row"><div class="field"><label>Estado</label><select name="status">' + Object.keys(INCIDENT_STATUS).map(k => '<option value="' + k + '" ' + (inc.status === k ? 'selected' : '') + '>' + INCIDENT_STATUS[k][0] + '</option>').join('') + '</select></div><div class="field"><label>Responsable</label><select name="responsibleId"><option value="">Sin asignar</option>' + employees.map(e => '<option value="' + e.id + '" ' + (inc.responsibleId === e.id ? 'selected' : '') + '>' + esc(e.name) + '</option>').join('') + '</select></div><div style="grid-column:1/-1"><button class="btn btn-primary btn-sm" type="submit">Actualizar</button></div></form>';
      }
      html += '<h3 style="font-size:14px;margin:18px 0 8px">📜 Timeline</h3><div class="timeline">';
      (inc.timeline || []).slice().reverse().forEach(t => { html += '<div class="timeline-item"><strong>' + esc(t.action) + '</strong><small>' + esc(t.by) + ' · ' + fmtDateTime(t.at) + '</small></div>'; });
      html += '</div><h3 style="font-size:14px;margin:18px 0 8px">💬 Comentarios (' + (inc.comments || []).length + ')</h3><div class="chat" id="inc-chat">';
      if (!(inc.comments || []).length) html += '<div class="empty-note">Sin comentarios.</div>';
      (inc.comments || []).forEach(c => {
        const mine = c.fromId === user.userId;
        html += '<div class="msg ' + (mine ? 'mine' : '') + '"><span class="who">' + esc(c.fromName) + ' · ' + esc(c.fromRole) + '</span>' + esc(c.text) + '<small>' + fmtDateTime(c.date) + '</small></div>';
      });
      html += '</div><form data-form="incident-comment" data-id="' + inc.id + '" class="chat-input"><input name="text" placeholder="Comentario..." required style="flex:1"><button class="btn btn-primary">➤</button></form>';
      return html;
    }

    function invoiceDetailHTML(inv) {
      const client = api.getClient(inv.clientId);
      const co = api.getCompany();
      const st = INVOICE_STATUS[inv.status];

      let html = '<h2 id="modal-title">Factura ' + esc(inv.number) + '</h2>';
      html += '<div class="invoice-preview"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:14px"><div><h3 style="margin:0">' + esc(co.name) + '</h3><div style="font-size:12px;color:var(--muted)">' + esc(co.taxId) + '<br>' + esc(co.address) + '<br>' + esc(co.email) + '</div></div><div style="text-align:right"><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><div style="font-size:12px;color:var(--muted);margin-top:6px">Emisión: ' + fmtDate(inv.issueDate) + '<br>Vence: ' + fmtDate(inv.dueDate) + '</div></div></div>';
      html += '<div style="background:#f8fafc;padding:10px;border-radius:10px;margin-bottom:14px"><b>Cliente</b><br>' + esc(client ? client.name : '—') + (client && client.taxId ? '<br>' + esc(client.taxId) : '') + '<br><small>' + esc(client ? client.address : '') + '</small></div>';
      html += '<table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f1f5f9"><th style="text-align:left;padding:8px">Concepto</th><th style="text-align:right;padding:8px">Cant.</th><th style="text-align:right;padding:8px">Precio</th><th style="text-align:right;padding:8px">IVA</th><th style="text-align:right;padding:8px">Total</th></tr></thead><tbody>';
      (inv.items || []).forEach(i => {
        const line = (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0);
        const tax = line * ((Number(i.tax) || 0) / 100);
        html += '<tr><td style="padding:8px">' + esc(i.description) + '</td><td style="text-align:right;padding:8px">' + esc(i.quantity) + '</td><td style="text-align:right;padding:8px">' + money(i.unitPrice) + '</td><td style="text-align:right;padding:8px">' + esc(i.tax) + '%</td><td style="text-align:right;padding:8px">' + money(line + tax) + '</td></tr>';
      });
      html += '</tbody></table><div class="tot">Subtotal: ' + money(inv.subtotal) + '<br>IVA: ' + money(inv.tax) + '<br><span style="font-size:18px;color:var(--primary)">TOTAL: ' + money(inv.total) + '</span></div>';
      if (inv.notes) html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><b>Notas:</b> ' + esc(inv.notes) + '</div>';
      if (inv.paidAt) html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ok);font-weight:700">✓ Pagada el ' + fmtDate(inv.paidAt) + '</div>';
      html += '</div>';

      html += '<h3 style="font-size:14px;margin:18px 0 8px">📜 Timeline</h3><div class="timeline">';
      (inv.timeline || []).slice().reverse().forEach(t => { html += '<div class="timeline-item"><strong>' + esc(t.action) + '</strong><small>' + fmtDate(t.at) + '</small></div>'; });
      html += '</div>';

    function drawRouteSVG() {
      const svg = document.getElementById('route-svg');
      if (!svg) return;
      const routes = api.computeRoute(ui.routeDate);
      if (!routes.length) { svg.innerHTML = ''; return; }

      // Collect all points
      const points = [];
      routes.forEach(r => r.services.forEach(s => { if (s.coords) points.push({ ...s.coords, employeeId: r.employeeId }); }));
      if (!points.length) { svg.innerHTML = '<text x="300" y="170" text-anchor="middle" fill="#94a3b8">Sin coordenadas disponibles</text>'; return; }

      const lats = points.map(p => p.lat), lngs = points.map(p => p.lng);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
      const pad = 30;
      const w = 600 - pad * 2, h = 340 - pad * 2;
      const latRange = Math.max(maxLat - minLat, 0.001);
      const lngRange = Math.max(maxLng - minLng, 0.001);

      const project = (p) => ({
        x: pad + ((p.lng - minLng) / lngRange) * w,
        y: pad + ((maxLat - p.lat) / latRange) * h
      });

      const colors = ['#0284c7', '#06b6d4', '#d97706', '#dc2626'];
      let svgContent = '';

      routes.forEach((r, rIdx) => {
        const color = colors[rIdx % colors.length];
        const path = r.services.filter(s => s.coords).map(s => project(s.coords));
        if (path.length > 1) {
          const d = path.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
          svgContent += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-dasharray="5,3"/>';
        }
        r.services.forEach((s, idx) => {
          if (!s.coords) return;
          const p = project(s.coords);
          svgContent += '<circle cx="' + p.x + '" cy="' + p.y + '" r="10" fill="' + color + '" stroke="#fff" stroke-width="2"/>';
          svgContent += '<text x="' + p.x + '" y="' + (p.y + 3.5) + '" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">' + (idx + 1) + '</text>';
        });
      });

      svg.innerHTML = svgContent;
    }

    /* ===== SIGNATURE PAD ===== */
    function initSignaturePad() {
      const canvas = document.getElementById('signature-canvas'); if (!canvas) return;
      ui.signaturePad = canvas; ui.signatureDrawing = false; ui.signatureEmpty = true;
      const ctx = canvas.getContext('2d'); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const getPos = (e) => { const rect = canvas.getBoundingClientRect(); const sx = canvas.width / rect.width; const sy = canvas.height / rect.height; const p = e.touches ? e.touches[0] : e; return { x: (p.clientX - rect.left) * sx, y: (p.clientY - rect.top) * sy }; };
      const start = (e) => { e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ui.signatureDrawing = true; ui.signatureEmpty = false; canvas.classList.add('signed'); };
      const move = (e) => { if (!ui.signatureDrawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const end = () => { ui.signatureDrawing = false; };
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    }

          () => resolve(null),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      });
    }

    function exportICS(dateStr, employeeId) {
      const routes = api.computeRoute(dateStr);
      const route = routes.find(r => r.employeeId === employeeId);
      if (!route) { toast('Ruta no encontrada', 'err'); return; }

      const escape = (s) => String(s || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
      const fmtICSDate = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CleanOps//ES\r\nCALSCALE:GREGORIAN\r\n';
      route.services.forEach((s, idx) => {
        const [h, m] = (s.time || '09:00').split(':').map(Number);
        const start = new Date(s.date + 'T' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':00');
        const end = new Date(start.getTime() + 60 * 60 * 1000);
        const client = api.getClient(s.clientId);
        ics += 'BEGIN:VEVENT\r\n';
        ics += 'UID:' + s.id + '@cleanops\r\n';
        ics += 'DTSTAMP:' + fmtICSDate(new Date()) + '\r\n';
        ics += 'DTSTART:' + fmtICSDate(start) + '\r\n';
        ics += 'DTEND:' + fmtICSDate(end) + '\r\n';
        ics += 'SUMMARY:' + escape((idx + 1) + '. ' + s.title) + '\r\n';
        ics += 'DESCRIPTION:' + escape('Cliente: ' + (client ? client.name : '—')) + '\r\n';
        if (client && client.address) ics += 'LOCATION:' + escape(client.address) + '\r\n';
        ics += 'END:VEVENT\r\n';
      });
      ics += 'END:VCALENDAR';

      downloadText('ruta-' + dateStr + '.ics', ics, 'text/calendar;charset=utf-8');
      toast('Calendario .ics descargado', 'ok');
    }

    /* ===== REMINDERS ===== */
    function runReminders() {
      if (!api.isAuthenticated()) return;
      const now = new Date();
      const user = api.getUser();
      const seen = JSON.parse(safeStorage.get('cleanops_seen_' + user.userId) || '{}');

      api.visibleServices().forEach(s => {
        if (s.status !== 'programado' && s.status !== 'en_camino') return;
        const dt = new Date(s.date + 'T' + s.time + ':00');
        const diffMin = (dt - now) / 60000;
        const key = 'svc30_' + s.id;
        if (diffMin > 0 && diffMin <= 30 && !seen[key]) {
          notify('⏰ Servicio en ' + Math.round(diffMin) + ' min: ' + s.title, 'warn');
          seen[key] = true;
        }
      });

      api.visibleIncidents().forEach(inc => {
        const sla = api.slaInfo(inc);
        if (!sla) return;
        const key = 'inc_' + inc.status + '_' + inc.id;
        if (sla.kind === 'late' && !seen[key + '_late']) { notify('⏰ SLA vencido: ' + inc.type, 'danger'); seen[key + '_late'] = true; }
        else if (sla.kind === 'warn' && !seen[key + '_warn']) { notify('⚠️ Riesgo de SLA: ' + inc.type, 'warn'); seen[key + '_warn'] = true; }
      });

      // Vencidas invoices
      api.db.invoices.forEach(inv => {
        if (inv.status !== 'enviada') return;
        if (inv.dueDate < localISO(new Date())) {
          const key = 'inv_overdue_' + inv.id;
          if (!seen[key]) { notify('💶 Factura vencida: ' + inv.number, 'danger'); seen[key] = true; }
        }
      });

      safeStorage.set('cleanops_seen_' + user.userId, JSON.stringify(seen));
    }

    setInterval(runReminders, 60000);

      else if (action === 'export-report') { if (el.dataset.format === 'csv') exportReportCSV(); else exportReportPDF(); }
    });

    document.addEventListener('change', e => {
      const el = e.target;
      if (el.matches('input[data-action="add-evidence"]')) {
        const file = el.files && el.files[0]; if (!file) return;
        const r = new FileReader();
        r.onload = () => { try { api.addEvidence(el.dataset.id, r.result); notify('📷 Foto añadida', 'ok'); const s = api.get('services', el.dataset.id); if (s) openModal(serviceDetailHTML(s)); } catch (err) { toast(err.message, 'err'); } };
        r.readAsDataURL(file);
      } else if (el.matches('input[data-attach-input]')) {
        const sid = el.dataset.attachInput;
        const preview = document.getElementById('chat-attach-preview-' + sid);
        if (preview) { const f = el.files && el.files[0]; preview.textContent = f ? '📎 ' + f.name : ''; }
      } else if (el.matches('[data-line-field]')) {
        const idx = Number(el.dataset.lineIdx);
        const field = el.dataset.lineField;
        let v = el.value;
        if (field === 'quantity' || field === 'unitPrice' || field === 'tax') v = Number(v) || 0;
        currentLines[idx][field] = v;
        if (document.getElementById('invoice-lines')) renderInvoiceLines(); else renderQuoteLines();
        // update form dataset
        const form = el.closest('form');
        if (form) form.dataset.items = JSON.stringify(currentLines);
      } else if (el.matches('input[data-change="route-date"]')) { ui.routeDate = el.value; setTimeout(drawRouteSVG, 50); }
      else if (el.matches('input[data-change="report-from"]')) { ui.reportFrom = el.value; render(); }
      else if (el.matches('input[data-change="report-to"]')) { ui.reportTo = el.value; render(); }
    });

    document.addEventListener('submit', e => {
      const form = e.target;
      if (form.id === 'login-form') { handleLoginSubmit(e); return; }
      if (form.dataset.form === 'add-task') {
        e.preventDefault();
        const data = collectForm(form);
        if (!data.name || data.name.trim().length < 2) { toast('Nombre corto', 'err'); return; }
        try { api.addTask(form.dataset.service, data.name.trim()); toast('Añadida', 'ok'); const s = api.get('services', form.dataset.service); if (s) openModal(serviceDetailHTML(s)); }
        catch (err) { toast(err.message, 'err'); }
        return;
      }
      if (form.dataset.form === 'send-message') {
        e.preventDefault();
        const serviceId = form.dataset.service;
        const data = collectForm(form);
        const fileInput = form.querySelector('input[type=file]');
        const file = fileInput && fileInput.files && fileInput.files[0];
        const doSend = (attachment) => {
          try { api.sendMessage(serviceId, data.text || '', attachment); form.reset(); const p = document.getElementById('chat-attach-preview-' + serviceId); if (p) p.textContent = ''; const s = api.get('services', serviceId); if (s) openModal(serviceDetailHTML(s), () => { const b = document.getElementById('chat-box'); if (b) b.scrollTop = b.scrollHeight; }); }
          catch (err) { toast(err.message, 'err'); }
        };
        if (file) { const r = new FileReader(); r.onload = () => doSend({ name: file.name, data: r.result }); r.readAsDataURL(file); }
        else doSend(null);
        return;
      }
      if (form.dataset.form === 'incident-comment') {
        e.preventDefault();
        const data = collectForm(form);
        try { api.addIncidentComment(form.dataset.id, data.text); toast('Comentario añadido', 'ok'); const inc = api.get('incidents', form.dataset.id); if (inc) openModal(incidentDetailHTML(inc), () => { const b = document.getElementById('inc-chat'); if (b) b.scrollTop = b.scrollHeight; }); }
        catch (err) { toast(err.message, 'err'); }
        return;
      }
      if (form.dataset.form === 'incident-update') {
        e.preventDefault();
        const data = collectForm(form);
        try { api.updateIncidentStatus(form.dataset.id, data.status, data.responsibleId); toast('Actualizada', 'ok'); render(); const inc = api.get('incidents', form.dataset.id); if (inc) openModal(incidentDetailHTML(inc)); }
        catch (err) { toast(err.message, 'err'); }
        return;
      }
      if (form.dataset.form === 'reschedule') {
        e.preventDefault();
        const data = collectForm(form);
        if (!validateEntityForm('reschedule', data, null, form)) { toast('Revisa los campos', 'err'); return; }
        try {
          api.rescheduleService(form.dataset.id, data.date, data.time, data.reason);
          closeModal(); toast('Reprogramado', 'ok'); render();
          notify('📅 Servicio reprogramado a ' + data.date + ' ' + data.time);
        } catch (err) { toast(err.message, 'err'); }
        return;
      }
      if (form.dataset.form === 'simulate-pay') {
        e.preventDefault();
        const data = collectForm(form);
        try {
          api.updateInvoiceStatus(form.dataset.id, 'pagada');
          closeModal(); notify('💳 Pago registrado: ' + data.method, 'ok'); render();
          const inv = api.get('invoices', form.dataset.id); if (inv) openModal(invoiceDetailHTML(inv));
        } catch (err) { toast(err.message, 'err'); }
        return;
      }

      handleEntityFormSubmit(e);
    });

    $('#modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
    document.addEventListener('keydown', e => {
      const overlay = $('#modal-overlay');
      const isOpen = overlay.classList.contains('open');
      if (e.key === 'Escape' && isOpen) closeModal();
      if (e.key === 'Tab' && isOpen) {
        const f = $('#modal-content').querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    render();
    setTimeout(runReminders, 2000);
  </script>
</body>
</html>
