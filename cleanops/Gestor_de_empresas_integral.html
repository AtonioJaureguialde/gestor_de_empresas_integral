<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanOps · Fase 3 Crecimiento y negocio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.2.5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.2.5/700.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --primary:#0284c7; --primary2:#06b6d4; --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
      --radius:16px; --shadow:0 10px 30px rgba(2,8,23,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    .app{display:flex;min-height:100vh}
    #sidebar{width:252px;background:#0b1220;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;transition:transform .3s}
    .brand{padding:18px 16px;border-bottom:1px solid rgba(148,163,184,.15);font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:10px}
    .brand span{background:linear-gradient(90deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
    .nav-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;font:600 13.5px 'Inter';cursor:pointer;text-align:left;width:100%}
    .nav-btn:hover{background:rgba(148,163,184,.12);color:#fff}
    .nav-btn.active{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff}
    .side-foot{padding:14px;border-top:1px solid rgba(148,163,184,.15);font-size:12px;color:#94a3b8}
    main{flex:1;min-width:0;display:flex;flex-direction:column}
    header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;z-index:30}
    h1{margin:0;font-size:18px;flex:1}
    .btn{border:0;border-radius:11px;padding:10px 16px;font:700 13px 'Inter';cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;text-decoration:none}
    .btn-primary{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff}
    .btn-primary:hover{filter:brightness(1.06)}
    .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .btn-danger{background:#fee2e2;color:var(--danger)}
    .btn-ok{background:#dcfce7;color:#15803d}
    .btn-warn{background:#fef3c7;color:#b45309}
    .btn-whatsapp{background:#25d366;color:#fff}
    .btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    #content{padding:22px;max-width:1200px;margin:0 auto;width:100%}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
    .table-card{padding:0;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th{padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.5px;background:#f8fafc}
    td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
    .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:6px 0}
    .cal-cell{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:100px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:.15s}
    .cal-cell:hover{border-color:var(--primary)}
    .cal-cell.other{opacity:.45;background:#f8fafc}
    .cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
    .cal-num{font-size:12px;font-weight:700;color:var(--muted)}
    .cal-events{display:flex;flex-direction:column;gap:4px}
    .cal-event{border:0;border-radius:6px;padding:4px 6px;font-size:10px;font-weight:700;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
    .cal-event.canceled{text-decoration:line-through;opacity:.75}
    .cal-add{margin-top:auto;border:1px dashed var(--line);background:#fff;border-radius:8px;color:var(--primary);font-weight:800;cursor:pointer;padding:4px}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;box-shadow:var(--shadow)}
    .empty-icon{font-size:48px;margin-bottom:16px;opacity:.65}
    .empty-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}
    .empty-desc{font-size:13px;max-width:320px;line-height:1.5}
    .empty-note{color:var(--muted);text-align:center;font-size:13px;font-weight:600;padding:10px 0 0}
    .field{margin-bottom:18px;position:relative}
    label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    input,select,textarea{width:100%;font:500 14px 'Inter';border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:.15s;color:var(--ink)}
    input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(2,132,199,.12)}
    input.invalid,select.invalid,textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.1)}
    .error-msg{position:absolute;bottom:-16px;left:0;font-size:11px;color:var(--danger);font-weight:600;opacity:0;transition:.15s;pointer-events:none}
    .field.has-error .error-msg{opacity:1}
    .form-alert{display:none;background:#fee2e2;color:#b91c1c;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:14px}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px;opacity:0;pointer-events:none;transition:.2s}
    .overlay.open{opacity:1;pointer-events:auto}
    .modal{background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3);transform:translateY(20px);transition:.2s}
    .overlay.open .modal{transform:none}
    .modal h2{margin:0 0 18px;font-size:18px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal-actions{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;font-size:13px;z-index:120;transition:.3s;opacity:0;box-shadow:0 12px 30px rgba(0,0,0,.3)}
    #toast.show{transform:translateX(-50%);opacity:1}
    #toast.err{background:var(--danger)}
    #toast.ok{background:var(--ok)}
    .menu-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:16px}
    .user-chip{font-size:12px;font-weight:700;color:var(--muted);background:#f8fafc;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
    .info-box{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;line-height:1.7}
    .demo-box{margin-top:16px;padding:12px;background:#f0f9ff;border-radius:10px;font-size:12px;color:#0369a1;line-height:1.7}
    .status-pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
    .tab-btn{background:transparent;border:0;padding:10px 14px;font:700 13px 'Inter';color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
    .tab-btn:hover{color:var(--ink)}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
    .task{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
    .task.done{background:#f0fdf4;border-color:#bbf7d0}
    .task.done span{text-decoration:line-through;color:var(--muted)}
    .task input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
    .task span{flex:1;font-weight:600;font-size:14px}
    .evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
    .evidence-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f8fafc}
    .evidence-item img{width:100%;height:100%;object-fit:cover;display:block}
    .evidence-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px}
    .signature-pad{border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block;width:100%;max-width:500px}
    .signature-pad.signed{border-style:solid;border-color:var(--primary)}
    .chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:10px;background:#f8fafc;border-radius:12px;margin-bottom:12px}
    .msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13px;background:#e2e8f0}
    .msg.mine{align-self:flex-end;background:#e0f2fe}
    .msg small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:600}
    .msg .who{font-size:10.5px;font-weight:800;color:var(--primary);display:block;margin-bottom:3px}
    .msg.mine .who{color:#0369a1}
    .msg-attach{margin-top:6px}
    .msg-attach img{max-width:180px;border-radius:8px;display:block;margin-top:4px}
    .chat-input{display:flex;gap:8px;align-items:flex-end}
    .chat-input input{flex:1}
    .chat-input .file-label{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700;font-size:14px}
    .chat-input input[type=file]{display:none}
    .timeline{border-left:3px solid var(--primary);padding-left:16px;margin:10px 0}
    .timeline-item{position:relative;padding:8px 0 16px}
    .timeline-item::before{content:'';position:absolute;left:-23px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 1px var(--primary)}
    .timeline-item strong{display:block;font-size:13px}
    .timeline-item small{color:var(--muted);font-size:11px}
    .sla-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:700;font-size:13px}
    .sla-bar.ok{background:#dcfce7;color:#15803d}
    .sla-bar.warn{background:#fef3c7;color:#b45309}
    .sla-bar.late{background:#fee2e2;color:#b91c1c}
    .checkin-box{padding:14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);margin-bottom:12px}
    .checkin-box .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .checkin-box.done{background:#dcfce7;border-color:#86efac}
    .qr-wrap{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;border:1px solid var(--line)}
    .notifs{position:fixed;top:80px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:320px}
    .notif{background:#fff;border-left:4px solid var(--primary);border-radius:10px;box-shadow:0 10px 30px rgba(2,8,23,.15);padding:12px 14px;font-size:13px;animation:slideIn .3s}
    .notif.warn{border-left-color:var(--warn)}
    .notif.danger{border-left-color:var(--danger)}
    .notif small{display:block;color:var(--muted);font-size:11px;margin-top:4px;font-weight:600}
    @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
    .badge-count{background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:800;margin-left:auto}
    /* Phase 3 UI */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
    .kpi{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:center}
    .kpi-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .kpi b{font-size:22px;font-weight:800;display:block;line-height:1.1}
    .kpi span{color:var(--muted);font-size:12px;font-weight:600}
    .kpi small{display:block;color:var(--ok);font-size:11px;font-weight:700;margin-top:4px}
    .invoice-preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;font-size:13px;line-height:1.6}
    .invoice-preview h3{margin:0 0 8px;font-size:16px}
    .invoice-preview table{margin-top:10px}
    .invoice-preview .tot{font-size:15px;font-weight:800;text-align:right;padding-top:10px;border-top:2px solid var(--ink)}
    .route-map{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
    .route-map svg{width:100%;height:340px;display:block}
    .route-stop{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;align-items:center}
    .route-stop .idx{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
    .route-stop .info{flex:1;min-width:0}
    .route-stop .info b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .route-stop .info small{color:var(--muted);font-size:11px}
    .quote-line{display:grid;grid-template-columns:2fr 80px 100px 100px auto;gap:8px;align-items:center;margin-bottom:6px}
    .quote-line input,.quote-line select{padding:7px 9px;font-size:13px}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    .filter-bar input,.filter-bar select{max-width:180px}
    .portal-hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
    .portal-hero h2{margin:0 0 6px;font-size:22px}
    .portal-hero p{margin:0;opacity:.9;font-size:14px}
    .action-row{display:flex;gap:8px;flex-wrap:wrap}
    .focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    @media(max-width:900px){
      #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}
      #sidebar.open{transform:none}
      .menu-toggle{display:block}
      .form-row,.quote-line{grid-template-columns:1fr}
      .user-chip{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" aria-label="Menú lateral"></aside>
    <main>
      <header>
        <button class="menu-toggle" data-action="toggle-menu" aria-label="Abrir o cerrar menú">☰</button>
        <h1 id="page-title">CleanOps</h1>
        <span style="flex:1"></span>
        <div id="auth-area"></div>
      </header>
      <div id="content" role="main"></div>
    </main>
  </div>

  <div class="overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" id="modal-content"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="notifs" id="notifs" aria-live="polite"></div>

  <script>
    /* ===========================================================
       CLEANOPS - FASE 1 + 2 + 3
       Base sólida + Operación en campo + Crecimiento y negocio
       =========================================================== */

    const DB_KEY = 'cleanops_phase3_db_v1';
    const SESSION_KEY = 'cleanops_phase3_session_v1';

    const STATUS_MAP = {
      programado: ['Programado', '#e0f2fe', '#0369a1'],
      en_camino: ['En camino', '#fef3c7', '#b45309'],
      iniciado: ['En curso', '#ede9fe', '#6d28d9'],
      finalizado: ['Finalizado', '#dcfce7', '#15803d'],
      validado: ['Validado', '#bbf7d0', '#166534'],
      cancelado: ['Cancelado', '#fee2e2', '#b91c1c']
    };

    const INCIDENT_STATUS = {
      abierta: ['Abierta', '#fee2e2', '#b91c1c'],
      en_proceso: ['En proceso', '#fef3c7', '#b45309'],
      resuelta: ['Resuelta', '#dcfce7', '#15803d'],
      cerrada: ['Cerrada', '#e2e8f0', '#475569']
    };

    const INCIDENT_PRI = { alta: ['Alta', 4], media: ['Media', 24], baja: ['Baja', 72] };

    const INVOICE_STATUS = {
      borrador: ['Borrador', '#e2e8f0', '#475569'],
      enviada: ['Enviada', '#e0f2fe', '#0369a1'],
      pagada: ['Pagada', '#dcfce7', '#15803d'],
      vencida: ['Vencida', '#fee2e2', '#b91c1c'],
      cancelada: ['Cancelada', '#f1f5f9', '#64748b']
    };

    const QUOTE_STATUS = {
      borrador: ['Borrador', '#e2e8f0', '#475569'],
      enviado: ['Enviado', '#e0f2fe', '#0369a1'],
      aceptado: ['Aceptado', '#dcfce7', '#15803d'],
      rechazado: ['Rechazado', '#fee2e2', '#b91c1c']
    };

    const ROLE_LABELS = {
      admin: 'Administración',
      manager: 'Gerencia',
      staff: 'Personal',
      client: 'Cliente'
    };

    const PERMISSIONS = {
      admin: ['calendar', 'clients', 'employees', 'services', 'incidents', 'chat', 'billing', 'reports', 'routes'],
      manager: ['calendar', 'clients', 'employees', 'services', 'incidents', 'chat', 'billing', 'reports', 'routes'],
      staff: ['calendar', 'services', 'incidents', 'chat', 'routes'],
      client: ['portal']
    };

    const safeStorage = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
    };

    function localISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function addDaysISO(n) { const d = new Date(); d.setDate(d.getDate() + n); return localISO(d); }
    function fmtDateTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    function money(n) { return (Number(n) || 0).toFixed(2) + ' €'; }

    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }
    function isValidPhone(v) { return /^[+0-9()\s.-]{6,20}$/.test(String(v || '').trim()); }
    function isValidStatus(v) { return Object.prototype.hasOwnProperty.call(STATUS_MAP, v); }

    class BackendAPI {
      constructor() {
        this.db = this.load();
        let session = null;
        try { session = JSON.parse(safeStorage.get(SESSION_KEY) || 'null'); } catch (e) { session = null; }
        this.session = session;
        if (this.session && !this.db.users.some(u => u.id === this.session.userId)) {
          this.session = null;
          safeStorage.remove(SESSION_KEY);
        }
      }

      load() {
        try {
          const raw = safeStorage.get(DB_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && p.users && p.clients && p.employees && p.services) {
              ['incidents', 'messages', 'attachments', 'invoices', 'quotes'].forEach(k => { if (!p[k]) p[k] = []; });
              // Auto-link client users
              p.users.forEach(u => {
                if (u.role === 'client' && !u.clientId) {
                  const c = p.clients.find(x => x.email && x.email === u.email);
                  if (c) u.clientId = c.id;
                }
              });
              return p;
            }
          }
        } catch (e) {}
        return this.seed();
      }

      seed() {
        return {
          users: [

      save() { safeStorage.set(DB_KEY, JSON.stringify(this.db)); }
      reset() { this.db = this.seed(); this.save(); }

      login(email, password) {
        const ne = String(email || '').toLowerCase().trim();
        if (!ne || !password) throw new Error('Credenciales incorrectas');
        const user = this.db.users.find(u => u.email.toLowerCase() === ne && u.password === password);
        if (!user) throw new Error('Credenciales incorrectas');
        this.session = {
          userId: user.id, role: user.role, name: user.name, email: user.email,
          employeeId: user.employeeId || null, clientId: user.clientId || null
        };
        safeStorage.set(SESSION_KEY, JSON.stringify(this.session));
        return this.session;
      }

      logout() { this.session = null; safeStorage.remove(SESSION_KEY); }
      isAuthenticated() { return !!this.session; }
      getUser() { return this.session; }
      hasPermission(m) { return this.isAuthenticated() && (PERMISSIONS[this.session.role] || []).includes(m); }
      getClient(id) { return this.db.clients.find(c => c.id === id); }
      getEmployee(id) { return this.db.employees.find(e => e.id === id); }
      getCompany() { return this.db.company; }

      visibleServices() {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        let arr = this.db.services.slice();
        if (user.role === 'staff') arr = arr.filter(s => s.employeeId === user.employeeId);
        else if (user.role === 'client') arr = arr.filter(s => s.clientId === user.clientId);
        return arr;
      }

      validate(entity, data, id) {
        const errors = {};
        const required = {
          clients: ['name', 'phone', 'address'],
          employees: ['name', 'phone', 'zone'],
          services: ['title', 'clientId', 'employeeId', 'date', 'time'],
          invoices: ['clientId', 'issueDate', 'dueDate'],
          quotes: ['clientId']
        }[entity] || [];
        required.forEach(f => { if (!data[f] || String(data[f]).trim() === '') errors[f] = 'Campo obligatorio'; });
        if (entity === 'clients' || entity === 'employees') {
          if (data.phone && !isValidPhone(data.phone)) errors.phone = 'Teléfono no válido';
        }
        if (entity === 'services') {
          if (data.price !== undefined && data.price !== null && String(data.price).trim() !== '') {
            const p = Number(data.price); if (isNaN(p) || p < 0) errors.price = 'Precio inválido';
          }
          if (data.status && !isValidStatus(data.status)) errors.status = 'Estado no válido';
          if (!errors.clientId && !this.getClient(data.clientId)) errors.clientId = 'Cliente no válido';
          if (!errors.employeeId && !this.getEmployee(data.employeeId)) errors.employeeId = 'Empleado no válido';
          if (!errors.employeeId && !errors.date && !errors.time) {
            const conflict = this.db.services.find(s => s.employeeId === data.employeeId && s.date === data.date && s.time === data.time && s.id !== id && s.status !== 'cancelado');
            if (conflict) errors.time = 'Conflicto de agenda';
          }
        }
        if (entity === 'incidents') {
          if (!data.serviceId) errors.serviceId = 'Servicio obligatorio';
          if (!data.description || data.description.trim().length < 10) errors.description = 'Mínimo 10 caracteres';
          if (!data.type) errors.type = 'Selecciona un tipo';
        }
        if (entity === 'invoices') {
          if (!errors.issueDate && !errors.dueDate && data.issueDate > data.dueDate) errors.dueDate = 'El vencimiento debe ser posterior a la emisión';
        }
        if (Object.keys(errors).length) throw { errors };
      }

      create(entity, data) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        if (entity === 'services' && !['admin', 'manager'].includes(user.role)) throw new Error('Sin permiso');
        if (entity === 'clients' && !this.hasPermission('clients')) throw new Error('Sin permiso');
        if (entity === 'employees' && !this.hasPermission('employees')) throw new Error('Sin permiso');
        if (entity === 'incidents' && !this.hasPermission('incidents')) throw new Error('Sin permiso');
        if (entity === 'invoices' && !this.hasPermission('billing')) throw new Error('Sin permiso');
        if (entity === 'quotes' && !this.hasPermission('billing')) throw new Error('Sin permiso');

        this.validate(entity, data, null);
        const record = Object.assign({ id: entity[0] + Date.now().toString(36) }, data);

        if (entity === 'services') {
          if (!record.status) record.status = 'programado';
          if (!record.tasks) record.tasks = [];
          record.checkin = null; record.checkout = null; record.evidence = []; record.signature = null;
        }
        if (entity === 'incidents') {
          record.status = 'abierta';
          record.createdAt = new Date().toISOString();
          record.createdBy = user.name + ' (' + ROLE_LABELS[user.role] + ')';
          record.slaDeadline = new Date(Date.now() + INCIDENT_PRI[record.priority][1] * 3600000).toISOString();
          record.timeline = [{ at: record.createdAt, by: user.name, action: 'Incidencia creada' }];
          record.comments = [];
        }
        if (entity === 'invoices') {
          const maxNum = this.db.invoices.reduce((max, inv) => {
            const m = inv.number.match(/(\d+)$/); return m ? Math.max(max, Number(m[1])) : max;
          }, 0);
          record.number = new Date().getFullYear() + '-' + String(maxNum + 1).padStart(4, '0');
          record.status = 'borrador';
          record.timeline = [{ at: new Date().toISOString(), action: 'Factura creada como borrador' }];
          this.recalcInvoice(record);
        }
        if (entity === 'quotes') {
          record.number = 'P-' + new Date().getFullYear() + '-' + String(this.db.quotes.length + 1).padStart(4, '0');
          record.status = 'borrador';
          record.createdAt = new Date().toISOString();
          record.timeline = [{ at: record.createdAt, action: 'Presupuesto creado' }];
          this.recalcQuote(record);
        }

        this.db[entity].push(record);
        this.save();
        return record;
      }

      update(entity, id, data) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const idx = this.db[entity].findIndex(r => r.id === id);
        if (idx === -1) throw new Error('Registro no encontrado');
        const existing = this.db[entity][idx];

        if (entity === 'services') {
          const canAdmin = ['admin', 'manager'].includes(user.role);
          const isOwnStaff = user.role === 'staff' && existing.employeeId === user.employeeId;
          if (!canAdmin && !isOwnStaff) throw new Error('Sin permiso');
        } else if (!this.hasPermission(entity === 'invoices' || entity === 'quotes' ? 'billing' : entity)) {
          throw new Error('Sin permiso');
        }

        const merged = Object.assign({}, existing, data);
        this.validate(entity, merged, id);
        if (entity === 'invoices') this.recalcInvoice(merged);
        if (entity === 'quotes') this.recalcQuote(merged);
        this.db[entity][idx] = merged;
        this.save();
        return merged;
      }

      recalcInvoice(inv) {
        const items = inv.items || [];
        inv.subtotal = items.reduce((s, i) => s + (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0), 0);
        inv.tax = items.reduce((s, i) => {
          const line = (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0);
          const rate = Number(i.tax) || 0;
          return s + line * (rate / 100);
        }, 0);
        inv.total = inv.subtotal + inv.tax;
      }

      recalcQuote(q) {
        const items = q.items || [];
        q.subtotal = items.reduce((s, i) => s + (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0), 0);
        q.tax = items.reduce((s, i) => {
          const line = (Number(i.quantity) || 0) * (Number(i.unitPrice) || 0);
          const rate = Number(i.tax) || 0;
          return s + line * (rate / 100);
        }, 0);
        q.total = q.subtotal + q.tax;
      }

      // Services - Phase 2 field updates
      updateServiceField(id, patch) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const idx = this.db.services.findIndex(s => s.id === id);
        if (idx === -1) throw new Error('Servicio no encontrado');
        const svc = this.db.services[idx];
        const canAdmin = ['admin', 'manager'].includes(user.role);
        const isOwnStaff = user.role === 'staff' && svc.employeeId === user.employeeId;
        const isOwnClient = user.role === 'client' && svc.clientId === user.clientId;
        if (!canAdmin && !isOwnStaff && !isOwnClient) throw new Error('Sin permiso');

        // Clients can only change status to certain values
        if (user.role === 'client' && patch.status) {
          const allowed = ['validado', 'cancelado'];
          if (!allowed.includes(patch.status)) throw new Error('El cliente solo puede validar o cancelar');
        }

        this.db.services[idx] = Object.assign({}, svc, patch);
        this.save();
        return this.db.services[idx];
      }

      rescheduleService(id, newDate, newTime, reason) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const idx = this.db.services.findIndex(s => s.id === id);
        if (idx === -1) throw new Error('Servicio no encontrado');
        const svc = this.db.services[idx];

        // Check permission
        const canAdmin = ['admin', 'manager'].includes(user.role);
        const isOwnClient = user.role === 'client' && svc.clientId === user.clientId;
        if (!canAdmin && !isOwnClient) throw new Error('Sin permiso');

        // Validate new slot
        const conflict = this.db.services.find(s => s.employeeId === svc.employeeId && s.date === newDate && s.time === newTime && s.id !== id && s.status !== 'cancelado');
        if (conflict) throw new Error('Ese horario ya está ocupado por otro servicio');

        const today = localISO(new Date());
        if (newDate < today) throw new Error('No se puede reprogramar a fecha pasada');

        const prev = svc.date + ' ' + svc.time;
        this.db.services[idx] = Object.assign({}, svc, { date: newDate, time: newTime });
        this.db.messages.push({
          id: 'm' + Date.now().toString(36), serviceId: id,
          fromId: user.userId, fromName: user.name, fromRole: ROLE_LABELS[user.role],
          text: '📅 Servicio reprogramado: de ' + prev + ' a ' + newDate + ' ' + newTime + (reason ? ' · Motivo: ' + reason : ''),
          date: new Date().toISOString(), attachments: []
        });
        this.save();
        return this.db.services[idx];
      }

      checkInService(id, coords) { return this.updateServiceField(id, { checkin: { at: new Date().toISOString(), coords }, status: 'en_camino' }); }
      checkoutService(id, coords) {
        const svc = this.get('services', id);
        if (!svc || !svc.checkin) throw new Error('Debes hacer check-in primero');
        return this.updateServiceField(id, { checkout: { at: new Date().toISOString(), coords }, status: (svc.evidence && svc.evidence.length ? 'finalizado' : 'iniciado') });
      }
      startService(id) { return this.updateServiceField(id, { status: 'iniciado' }); }
      finalizeService(id) {
        const svc = this.get('services', id); if (!svc) throw new Error('No encontrado');
        return this.updateServiceField(id, { status: 'finalizado', checkout: svc.checkout || { at: new Date().toISOString(), coords: null } });
      }
      validateService(id) {
        const svc = this.get('services', id);
        if (!svc || svc.status !== 'finalizado') throw new Error('Debe estar finalizado');
        return this.updateServiceField(id, { status: 'validado', signature: svc.signature || { by: this.getUser().name, at: new Date().toISOString() } });
      }

      toggleTask(serviceId, taskId) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        const tasks = (svc.tasks || []).map(t => t.id === taskId ? Object.assign({}, t, { done: !t.done }) : t);
        return this.updateServiceField(serviceId, { tasks });
      }
      addTask(serviceId, name) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        const tasks = (svc.tasks || []).slice();
        tasks.push({ id: 't' + Date.now().toString(36), name, done: false });
        return this.updateServiceField(serviceId, { tasks });
      }
      removeTask(serviceId, taskId) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        return this.updateServiceField(serviceId, { tasks: (svc.tasks || []).filter(t => t.id !== taskId) });
      }
      addEvidence(serviceId, dataUrl) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        const evidence = (svc.evidence || []).slice();
        evidence.push({ id: 'ev' + Date.now().toString(36), data: dataUrl, at: new Date().toISOString() });
        return this.updateServiceField(serviceId, { evidence });
      }
      removeEvidence(serviceId, evId) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        return this.updateServiceField(serviceId, { evidence: (svc.evidence || []).filter(e => e.id !== evId) });
      }
      saveSignature(serviceId, dataUrl) {
        const svc = this.get('services', serviceId); if (!svc) throw new Error('No encontrado');
        return this.updateServiceField(serviceId, { signature: { data: dataUrl, by: this.getUser().name, at: new Date().toISOString() } });
      }

      sendMessage(serviceId, text, attachment) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const msg = {
          id: 'm' + Date.now().toString(36), serviceId,
          fromId: user.userId, fromName: user.name, fromRole: ROLE_LABELS[user.role] || user.role,
          text: String(text || '').trim(), date: new Date().toISOString(),
          attachments: attachment ? [attachment] : []
        };
        if (!msg.text && msg.attachments.length === 0) throw new Error('Escribe un mensaje o adjunta');
        this.db.messages.push(msg);
        this.save();
        return msg;
      }
      messagesOf(serviceId) { return this.db.messages.filter(m => m.serviceId === serviceId).sort((a, b) => a.date.localeCompare(b.date)); }

      visibleIncidents() {
        const ids = new Set(this.visibleServices().map(s => s.id));
        return this.db.incidents.filter(i => ids.has(i.serviceId));
      }

      updateIncidentStatus(id, newStatus, responsibleId) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const idx = this.db.incidents.findIndex(i => i.id === id);
        if (idx === -1) throw new Error('No encontrada');
        const inc = this.db.incidents[idx];
        const timeline = (inc.timeline || []).slice();
        const now = new Date().toISOString();
        timeline.push({ at: now, by: user.name, action: 'Estado → ' + INCIDENT_STATUS[newStatus][0] });
        if (responsibleId !== undefined && responsibleId !== inc.responsibleId) {
          const emp = this.getEmployee(responsibleId);
          timeline.push({ at: now, by: user.name, action: 'Responsable: ' + (emp ? emp.name : '—') });
        }
        this.db.incidents[idx] = Object.assign({}, inc, {
          status: newStatus,
          responsibleId: responsibleId !== undefined ? responsibleId : inc.responsibleId,
          timeline
        });
        this.save();
        return this.db.incidents[idx];
      }

      addIncidentComment(incidentId, text) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        const idx = this.db.incidents.findIndex(i => i.id === incidentId);
        if (idx === -1) throw new Error('No encontrada');
        if (!text || text.trim().length < 2) throw new Error('Comentario demasiado corto');
        const inc = this.db.incidents[idx];
        const comment = { id: 'c' + Date.now().toString(36), fromId: user.userId, fromName: user.name, fromRole: ROLE_LABELS[user.role], text: text.trim(), date: new Date().toISOString() };
        inc.comments = (inc.comments || []).concat([comment]);
        inc.timeline = (inc.timeline || []).concat([{ at: comment.date, by: user.name, action: 'Comentario añadido' }]);
        this.db.incidents[idx] = inc;
        this.save();
        return comment;
      }

      // Invoices
      updateInvoiceStatus(id, newStatus, paidAt) {
        if (!this.hasPermission('billing')) throw new Error('Sin permiso');
        const idx = this.db.invoices.findIndex(i => i.id === id);
        if (idx === -1) throw new Error('No encontrada');
        const inv = this.db.invoices[idx];
        const timeline = (inv.timeline || []).slice();
        timeline.push({ at: new Date().toISOString(), action: 'Estado → ' + INVOICE_STATUS[newStatus][0] });
        const patch = { status: newStatus, timeline };
        if (newStatus === 'pagada') patch.paidAt = paidAt || new Date().toISOString();
        this.db.invoices[idx] = Object.assign({}, inv, patch);
        this.save();
        return this.db.invoices[idx];
      }

      invoiceFromService(serviceId) {
        if (!this.hasPermission('billing')) throw new Error('Sin permiso');
        const svc = this.get('services', serviceId);
        if (!svc) throw new Error('Servicio no encontrado');
        if (svc.status !== 'validado' && svc.status !== 'finalizado') throw new Error('El servicio debe estar finalizado/validado');
        const co = this.getCompany();
        return this.create('invoices', {
          clientId: svc.clientId,
          serviceIds: [serviceId],
          issueDate: localISO(new Date()),
          dueDate: addDaysISO(30),
          items: [{ description: svc.title + ' (' + svc.date + ')', quantity: 1, unitPrice: Number(svc.price) || 0, tax: co.taxRate }],
          notes: ''
        });
      }

      deleteClient(id) {
        if (!this.hasPermission('clients')) throw new Error('Sin permiso');
        const svcIds = this.db.services.filter(s => s.clientId === id).map(s => s.id);
        this.db.services = this.db.services.filter(s => s.clientId !== id);
        this.db.incidents = this.db.incidents.filter(i => !svcIds.includes(i.serviceId));
        this.db.messages = this.db.messages.filter(m => !svcIds.includes(m.serviceId));
        this.db.clients = this.db.clients.filter(c => c.id !== id);
        this.db.users = this.db.users.filter(u => u.clientId !== id);
        this.save();
      }

      deleteEmployee(id) {
        if (!this.hasPermission('employees')) throw new Error('Sin permiso');
        this.db.services.forEach(s => { if (s.employeeId === id) s.employeeId = ''; });
        this.db.employees = this.db.employees.filter(e => e.id !== id);
        this.save();
      }

      deleteService(id) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const user = this.getUser();
        if (!['admin', 'manager'].includes(user.role)) throw new Error('Sin permiso');
        this.db.incidents = this.db.incidents.filter(i => i.serviceId !== id);
        this.db.messages = this.db.messages.filter(m => m.serviceId !== id);
        this.db.invoices.forEach(inv => { inv.serviceIds = (inv.serviceIds || []).filter(x => x !== id); });
        this.db.services = this.db.services.filter(s => s.id !== id);
        this.save();
      }

      list(entity) {
        if (!this.isAuthenticated()) throw new Error('No autenticado');
        const permKey = (entity === 'invoices' || entity === 'quotes') ? 'billing' : entity;
        if (!this.hasPermission(permKey)) throw new Error('Sin permiso');
        return this.db[entity].slice();
      }

      get(entity, id) {
        const arr = this.db[entity] || [];

      }

      slaInfo(inc) {
        if (!inc) return null;
        const now = Date.now();
        const deadline = new Date(inc.slaDeadline).getTime();
        const hoursLeft = (deadline - now) / 3600000;
        const status = inc.status;
        if (status === 'resuelta' || status === 'cerrada') return { label: 'Cumplida', kind: 'ok', hoursLeft: Infinity };
        if (hoursLeft < 0) return { label: 'SLA vencido', kind: 'late', hoursLeft };
        if (hoursLeft < INCIDENT_PRI[inc.priority][1] * 0.25) return { label: 'Riesgo de SLA', kind: 'warn', hoursLeft };
        return { label: 'En plazo', kind: 'ok', hoursLeft };
      }

      // --- Reports ---
      reportStats(rangeFrom, rangeTo) {
        const from = new Date(rangeFrom + 'T00:00:00');
        const to = new Date(rangeTo + 'T23:59:59');
        const inRange = s => { const d = new Date(s.date + 'T00:00:00'); return d >= from && d <= to; };

        const svcsInRange = this.db.services.filter(inRange);
        const completed = svcsInRange.filter(s => s.status === 'validado' || s.status === 'finalizado');
        const canceled = svcsInRange.filter(s => s.status === 'cancelado');

        const revenue = completed.reduce((s, svc) => s + (Number(svc.price) || 0), 0);

        // By employee
        const byEmployee = {};
        this.db.employees.forEach(e => { byEmployee[e.id] = { name: e.name, count: 0, revenue: 0 }; });
        completed.forEach(s => {
          if (byEmployee[s.employeeId]) {
            byEmployee[s.employeeId].count++;
            byEmployee[s.employeeId].revenue += Number(s.price) || 0;
          }
        });

        // By client
        const byClient = {};
        this.db.clients.forEach(c => { byClient[c.id] = { name: c.name, count: 0, revenue: 0 }; });
        completed.forEach(s => {
          if (byClient[s.clientId]) {
            byClient[s.clientId].count++;
            byClient[s.clientId].revenue += Number(s.price) || 0;
          }
        });

        // Incidents in range
        const incidentsInRange = this.db.incidents.filter(i => {
          const d = new Date(i.createdAt); return d >= from && d <= to;
        });

        // Invoices
        const invoicesInRange = this.db.invoices.filter(i => {
          const d = new Date(i.issueDate); return d >= from && d <= to;
        });
        const invoicedTotal = invoicesInRange.reduce((s, i) => s + (Number(i.total) || 0), 0);
        const paidTotal = invoicesInRange.filter(i => i.status === 'pagada').reduce((s, i) => s + (Number(i.total) || 0), 0);
        const outstandingTotal = invoicesInRange.filter(i => i.status === 'enviada' || i.status === 'vencida').reduce((s, i) => s + (Number(i.total) || 0), 0);

        const avgRating = 4.8; // mock

        return {
          totalServices: svcsInRange.length,
          completed: completed.length,
          canceled: canceled.length,
          completionRate: svcsInRange.length ? (completed.length / svcsInRange.length) * 100 : 0,
          revenue,
          invoicedTotal,
          paidTotal,
          outstandingTotal,
          incidents: incidentsInRange.length,
          avgRating,
          byEmployee: Object.values(byEmployee).filter(x => x.count > 0),
          byClient: Object.values(byClient).filter(x => x.count > 0)
        };
      }

      // --- Routes: nearest-neighbor heuristic ---
      computeRoute(dateStr) {
        const services = this.db.services.filter(s => s.date === dateStr && s.status !== 'cancelado').sort((a, b) => String(a.time).localeCompare(String(b.time)));
        if (!services.length) return [];

        const withCoords = services.filter(s => s.coords);
        const withoutCoords = services.filter(s => !s.coords);

        const haversine = (a, b) => {
          const R = 6371;
          const toRad = x => x * Math.PI / 180;
          const dLat = toRad(b.lat - a.lat);
          const dLng = toRad(b.lng - a.lng);
          const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
          return 2 * R * Math.asin(Math.sqrt(h));
        };

        // Group by employee
        const groups = {};
        services.forEach(s => {
          if (!groups[s.employeeId]) groups[s.employeeId] = [];
          groups[s.employeeId].push(s);
        });

        const routes = [];
        Object.entries(groups).forEach(([empId, list]) => {
          // Sort by time, then greedy nearest neighbor within same time window
          list.sort((a, b) => String(a.time).localeCompare(String(b.time)));
          const ordered = [];
          const remaining = list.slice();

          let current = remaining.shift();
          if (current) ordered.push(current);

          while (remaining.length) {
            if (!current || !current.coords) {
              ordered.push(remaining.shift());
              current = ordered[ordered.length - 1];
              continue;
            }
            let best = null, bestIdx = -1, bestDist = Infinity;
            remaining.forEach((s, idx) => {
              if (!s.coords) return;
              const d = haversine(current.coords, s.coords);
              if (d < bestDist) { bestDist = d; best = s; bestIdx = idx; }
            });
            if (bestIdx >= 0) {
              ordered.push(best);
              remaining.splice(bestIdx, 1);
              current = best;
            } else {
              ordered.push(remaining.shift());
              current = ordered[ordered.length - 1];
            }
          }

          let totalKm = 0;
          for (let i = 1; i < ordered.length; i++) {
            if (ordered[i - 1].coords && ordered[i].coords) {
              totalKm += haversine(ordered[i - 1].coords, ordered[i].coords);
            }
          }

          routes.push({
            employeeId: empId,
            employee: this.getEmployee(empId),
            services: ordered,
            totalKm: Math.round(totalKm * 10) / 10
          });
        });

        return routes;
      }
    }

    function handleEntityFormSubmit(e) {

            delete data.tasksText;

        if (entity === 'invoices' || entity === 'quotes') {

    }

    function renderCalendar() {
      const y = ui.calYear, m = ui.calMonth;
      const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      const dayNames = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
      const todayStr = localISO(new Date());
      const monthPrefix = y + '-' + String(m + 1).padStart(2, '0');
      let services = []; try { services = api.visibleServices(); } catch (e) {}
      const firstDay = new Date(y, m, 1); const startPad = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate(); const prevLastDay = new Date(y, m, 0).getDate();
      const canCreate = canCreateService();

      const cells = [];
      for (let i = startPad - 1; i >= 0; i--) cells.push({ other: true, day: prevLastDay - i, date: '', services: [] });
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const dayServices = services.filter(s => s.date === dateStr).sort((a, b) => String(a.time).localeCompare(String(b.time)));
        cells.push({ other: false, day: d, date: dateStr, isToday: dateStr === todayStr, services: dayServices });
      }
      for (let d = 1; cells.length < 42; d++) cells.push({ other: true, day: d, date: '', services: [] });

      const cellHTML = cells.map(c => {
        const classes = ['cal-cell']; if (c.other) classes.push('other'); if (c.isToday) classes.push('today');
        const dayNumber = c.other ? '' : '<span class="cal-num">' + c.day + '</span>';
        const eventsHTML = (c.services || []).map(s => {
          const st = STATUS_MAP[s.status] || STATUS_MAP.programado;
          const canceled = s.status === 'cancelado' ? ' canceled' : '';
          return '<button type="button" class="cal-event' + canceled + '" style="background:' + st[1] + ';color:' + st[2] + '" data-action="view-service" data-id="' + s.id + '">' + esc(s.time) + ' · ' + esc(s.title) + '</button>';
        }).join('');
        const addBtn = (!c.other && canCreate) ? '<button type="button" class="cal-add" data-action="new-service-date" data-date="' + c.date + '">＋</button>' : '';
        return '<div class="' + classes.join(' ') + '">' + dayNumber + '<div class="cal-events">' + eventsHTML + '</div>' + addBtn + '</div>';
      }).join('');

      return '<div class="card"><div class="cal-header"><button class="btn btn-ghost btn-sm" data-action="cal-prev">◀</button><h2 style="margin:0;font-size:18px">' + monthNames[m] + ' ' + y + '</h2><button class="btn btn-ghost btn-sm" data-action="cal-next">▶</button></div><div class="cal-grid">' + dayNames.map(d => '<div class="cal-day-name">' + d + '</div>').join('') + cellHTML + '</div></div>' + (canCreate ? '<div style="text-align:right"><button class="btn btn-primary" data-action="new-service">＋ Nuevo servicio</button></div>' : '');
    }

    /* ===== SERVICES LIST ===== */
    function renderServices() {
      let services = []; try { services = api.visibleServices().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)); } catch (e) {}
      const canCreate = canCreateService();
      if (!services.length) return emptyState('📋', 'No hay servicios visibles', canCreate ? 'Crea uno desde el calendario.' : 'No tienes servicios asignados.', canCreate ? '<button class="btn btn-primary" data-action="new-service">＋ Crear servicio</button>' : '');
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + services.length + ' servicio' + (services.length !== 1 ? 's' : '') + '</span>' + (canCreate ? '<button class="btn btn-primary" data-action="new-service">＋ Nuevo servicio</button>' : '') + '</div><div style="display:flex;flex-direction:column;gap:10px">' +
        services.map(s => {
          const client = api.getClient(s.clientId);
          const employee = api.getEmployee(s.employeeId);
          const st = STATUS_MAP[s.status] || STATUS_MAP.programado;
          const taskDone = (s.tasks || []).filter(t => t.done).length;
          const taskTotal = (s.tasks || []).length;
          return '<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:0"><div style="flex:1;min-width:220px"><div style="font-weight:700;font-size:15px">' + esc(s.title) + '</div><div style="color:var(--muted);font-size:13px;margin-top:3px">📅 ' + esc(s.date) + ' · 🕐 ' + esc(s.time) + ' · 🏢 ' + esc(client ? client.name : '—') + ' · 👤 ' + esc(employee ? employee.name : 'Sin asignar') + '</div><div style="color:var(--muted);font-size:11px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap"><span>✅ ' + taskDone + '/' + taskTotal + '</span>' + (s.evidence && s.evidence.length ? '<span>📷 ' + s.evidence.length + '</span>' : '') + (s.signature ? '<span>✍️</span>' : '') + (s.checkin ? '<span>📍</span>' : '') + '<span>💶 ' + money(s.price) + '</span></div></div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><button class="btn btn-ghost btn-sm" data-action="view-service" data-id="' + s.id + '">Abrir</button></div>';
        }).join('') + '</div>';
    }

    /* ===== PORTAL CLIENT ===== */
    function renderPortal() {
      const user = api.getUser();
      const client = api.getClient(user.clientId);
      if (!client) return emptyState('❓', 'Cliente no configurado', 'Contacta con la administración para vincular tu cuenta.');

      let services = []; try { services = api.visibleServices().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)); } catch (e) {}
      const next = services.find(s => ['programado', 'en_camino', 'iniciado'].includes(s.status));
      const pendingValidation = services.filter(s => s.status === 'finalizado').length;
      const unpaidInvoices = api.db.invoices.filter(i => i.clientId === client.id && (i.status === 'enviada' || i.status === 'vencida'));
      const myIncidents = api.visibleIncidents().filter(i => i.status !== 'cerrada');

      let html = '<div class="portal-hero"><h2>👋 Hola, ' + esc(user.name) + '</h2><p>Portal de cliente de ' + esc(client.name) + '</p></div>';
      html += '<div class="kpi-grid">';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#e0f2fe">📅</div><div><b>' + (next ? 'Próximo' : '—') + '</b><span>' + (next ? esc(next.date) + ' · ' + esc(next.time) : 'Sin próximos servicios') + '</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#dcfce7">⏳</div><div><b>' + pendingValidation + '</b><span>Por validar</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fef3c7">💶</div><div><b>' + money(unpaidInvoices.reduce((s, i) => s + Number(i.total), 0)) + '</b><span>Pendiente de pago</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fee2e2">⚠️</div><div><b>' + myIncidents.length + '</b><span>Incidencias abiertas</span></div></div>';
      html += '</div>';

      // Next service card
      if (next) {
        const emp = api.getEmployee(next.employeeId);
        html += '<div class="card"><h3 style="margin:0 0 10px">Próximo servicio</h3><div style="font-weight:700;font-size:15px">' + esc(next.title) + '</div><div style="color:var(--muted);font-size:13px;margin-top:4px">📅 ' + esc(next.date) + ' · 🕐 ' + esc(next.time) + ' · 👤 ' + esc(emp ? emp.name : 'Sin asignar') + '</div><div class="action-row" style="margin-top:14px"><button class="btn btn-ghost btn-sm" data-action="view-service" data-id="' + next.id + '">Ver detalles</button><button class="btn btn-warn btn-sm" data-action="reschedule" data-id="' + next.id + '">📅 Reprogramar</button>' + (emp && emp.whatsapp ? '<a class="btn btn-whatsapp btn-sm" href="https://wa.me/' + esc(emp.whatsapp.replace(/\D/g, '')) + '?text=' + encodeURIComponent('Hola, soy cliente de ' + client.name + '. Consulta sobre mi servicio del ' + next.date) + '" target="_blank">💬 WhatsApp</a>' : '') + '</div></div>';
      }

      // Pending validation
      const toValidate = services.filter(s => s.status === 'finalizado');
      if (toValidate.length) {
        html += '<h3 style="margin:22px 0 10px">⏳ Servicios por validar</h3><div style="display:flex;flex-direction:column;gap:10px">';
        toValidate.forEach(s => {
          const emp = api.getEmployee(s.employeeId);
          html += '<div class="card" style="margin-bottom:0"><div style="font-weight:700">' + esc(s.title) + '</div><div style="color:var(--muted);font-size:13px;margin-top:3px">' + esc(s.date) + ' · ' + esc(s.time) + ' · ' + esc(emp ? emp.name : '—') + '</div><div class="action-row" style="margin-top:10px"><button class="btn btn-primary btn-sm" data-action="view-service" data-id="' + s.id + '" data-tab="signature">✍️ Validar y firmar</button><button class="btn btn-warn btn-sm" data-action="new-incident-from-service" data-id="' + s.id + '">⚠️ Notificar problema</button></div></div>';
        });
        html += '</div>';
      }

      // Unpaid invoices
      if (unpaidInvoices.length) {
        html += '<h3 style="margin:22px 0 10px">💶 Facturas pendientes</h3><div style="display:flex;flex-direction:column;gap:10px">';
        unpaidInvoices.forEach(inv => {
          const st = INVOICE_STATUS[inv.status];
          html += '<div class="card" style="margin-bottom:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div style="font-weight:700">' + esc(inv.number) + '</div><div style="color:var(--muted);font-size:13px">Emitida: ' + fmtDate(inv.issueDate) + ' · Vence: ' + fmtDate(inv.dueDate) + '</div></div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span></div><div style="font-size:15px;font-weight:800;margin-top:8px">' + money(inv.total) + '</div><div class="action-row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-action="view-invoice" data-id="' + inv.id + '">Ver factura</button><button class="btn btn-ok btn-sm" data-action="client-pay" data-id="' + inv.id + '">💳 Pagar ahora</button></div></div>';
        });
        html += '</div>';
      }

      // Recent history
      const history = services.filter(s => s.status === 'validado').slice(0, 5);
      if (history.length) {
        html += '<h3 style="margin:22px 0 10px">🕐 Historial reciente</h3><div style="display:flex;flex-direction:column;gap:6px">';
        history.forEach(s => {
          html += '<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:0"><div style="flex:1"><b>' + esc(s.title) + '</b><br><small style="color:var(--muted)">' + esc(s.date) + ' · ' + money(s.price) + '</small></div><span class="status-pill" style="background:#dcfce7;color:#15803d">Validado</span></div>';
        });
        html += '</div>';
      }

      return html;
    }

    /* ===== INCIDENTS ===== */
    function renderIncidents() {
      let incidents = []; try { incidents = api.visibleIncidents().slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)); } catch (e) {}
      if (!incidents.length) return emptyState('🎉', 'Sin incidencias', 'Todo está en orden.');
      return '<div style="margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + incidents.length + ' incidencia' + (incidents.length !== 1 ? 's' : '') + '</span><button class="btn btn-primary" data-action="new-incident">⚠️ Nueva incidencia</button></div><div style="display:flex;flex-direction:column;gap:10px">' +
        incidents.map(inc => {
          const svc = api.get('services', inc.serviceId);
          const client = svc ? api.getClient(svc.clientId) : null;
          const responsible = inc.responsibleId ? api.getEmployee(inc.responsibleId) : null;
          const st = INCIDENT_STATUS[inc.status];
          const pri = INCIDENT_PRI[inc.priority];
          const sla = api.slaInfo(inc);
          return '<div class="card" style="margin-bottom:0"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div style="font-weight:700">' + esc(inc.type) + '</div><div style="color:var(--muted);font-size:13px;margin-top:3px">' + (svc ? esc(svc.title) : '—') + ' · ' + (client ? esc(client.name) : '—') + '</div><div style="color:var(--muted);font-size:11px;margin-top:6px">👤 ' + esc(responsible ? responsible.name : 'Sin asignar') + ' · ' + fmtDateTime(inc.createdAt) + '</div></div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><span class="status-pill" style="background:#fee2e2;color:#b91c1c">' + pri[0] + '</span><button class="btn btn-ghost btn-sm" data-action="view-incident" data-id="' + inc.id + '">Abrir</button></div>' + (sla ? '<div class="sla-bar ' + sla.kind + '" style="margin-top:10px">' + (sla.kind === 'ok' ? '✅ ' : sla.kind === 'warn' ? '⚠️ ' : '⏰ ') + esc(sla.label) + (isFinite(sla.hoursLeft) ? ' · ' + Math.max(0, Math.round(sla.hoursLeft)) + 'h restantes' : '') + '</div>' : '') + '</div>';
        }).join('') + '</div>';
    }

    /* ===== CHAT ===== */
    function renderChat() {
      let services = []; try { services = api.visibleServices().slice().sort((a, b) => { const ma = api.messagesOf(a.id), mb = api.messagesOf(b.id); const la = ma.length ? ma[ma.length - 1].date : a.date; const lb = mb.length ? mb[mb.length - 1].date : b.date; return lb.localeCompare(la); }); } catch (e) {}
      if (!services.length) return emptyState('💬', 'Sin conversaciones', 'Crea un servicio para empezar a chatear.');
      return '<div style="margin-bottom:14px"><span style="color:var(--muted);font-weight:600">' + services.length + ' conversación' + (services.length !== 1 ? 'es' : '') + '</span></div><div style="display:flex;flex-direction:column;gap:10px">' +
        services.map(s => {
          const client = api.getClient(s.clientId);
          const employee = api.getEmployee(s.employeeId);
          const msgs = api.messagesOf(s.id);
          const last = msgs[msgs.length - 1];
          const st = STATUS_MAP[s.status];
          return '<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:0"><div style="flex:1;min-width:220px"><div style="font-weight:700">' + esc(s.title) + '</div><div style="color:var(--muted);font-size:13px;margin-top:3px">' + (client ? esc(client.name) : '—') + ' · ' + (employee ? esc(employee.name) : 'Sin asignar') + '</div>' + (last ? '<div style="color:var(--primary);font-size:12px;margin-top:6px;font-weight:600">' + esc(last.fromName) + ': ' + esc(last.text || '📎 Adjunto') + '</div>' : '<div style="color:var(--muted);font-size:12px;margin-top:6px">Sin mensajes</div>') + '</div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><button class="btn btn-primary btn-sm" data-action="view-service" data-id="' + s.id + '" data-tab="chat">💬 Abrir</button></div>';
        }).join('') + '</div>';
    }

    /* ===== ROUTES ===== */
    function renderRoutes() {
      if (!api.hasPermission('routes')) return emptyState('🔒', 'Sin permisos', 'No tienes acceso a rutas.');

      const routes = api.computeRoute(ui.routeDate);
      const dateStr = fmtDate(ui.routeDate);

      let html = '<div class="card"><div class="cal-header"><h2 style="margin:0;font-size:18px">🗺️ Rutas del día</h2></div><div class="filter-bar"><label style="margin:0">Fecha:</label><input type="date" data-change="route-date" value="' + esc(ui.routeDate) + '"></div>';

      if (!routes.length) {
        html += emptyState('📭', 'Sin servicios para este día', 'No hay servicios programados para ' + dateStr);
        return html + '</div>';
      }

      // SVG visual map (normalized coordinates)
      html += '<div class="route-map"><svg id="route-svg" viewBox="0 0 600 340" preserveAspectRatio="xMidYMid meet"></svg></div>';

      routes.forEach((route, rIdx) => {
        html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div><h3 style="margin:0">👤 ' + esc(route.employee ? route.employee.name : 'Sin asignar') + '</h3><div style="color:var(--muted);font-size:12px">' + route.services.length + ' paradas · ~' + route.totalKm + ' km totales</div></div><div class="action-row"><button class="btn btn-ghost btn-sm" data-action="export-ics" data-date="' + esc(ui.routeDate) + '" data-employee="' + esc(route.employeeId) + '">📅 Exportar .ics</button>' + (route.employee && route.employee.whatsapp ? '<a class="btn btn-whatsapp btn-sm" href="https://wa.me/' + esc(route.employee.whatsapp.replace(/\D/g, '')) + '?text=' + encodeURIComponent('Hola, aquí tienes tu ruta del ' + dateStr) + '" target="_blank">💬 Enviar ruta</a>' : '') + '</div></div>';
        route.services.forEach((s, idx) => {
          const client = api.getClient(s.clientId);
          html += '<div class="route-stop"><div class="idx">' + (idx + 1) + '</div><div class="info"><b>' + esc(s.time) + ' · ' + esc(s.title) + '</b><small>' + esc(client ? client.name : '—') + ' · ' + esc(client ? client.address : '—') + '</small></div><button class="btn btn-ghost btn-sm" data-action="view-service" data-id="' + s.id + '">Ver</button></div>';
        });
        html += '</div>';
      });

      html += '</div>';
      return html;
    }

    /* ===== BILLING ===== */
    function renderBilling() {
      if (!api.hasPermission('billing')) return emptyState('🔒', 'Sin permisos', 'No tienes acceso a facturación.');
      let invoices = []; let quotes = [];
      try { invoices = api.list('invoices'); quotes = api.list('quotes'); } catch (e) {}

      const unpaid = invoices.filter(i => i.status === 'enviada' || i.status === 'vencida');
      const paid = invoices.filter(i => i.status === 'pagada');
      const totalUnpaid = unpaid.reduce((s, i) => s + Number(i.total), 0);
      const totalPaid = paid.reduce((s, i) => s + Number(i.total), 0);

      let html = '<div class="tabs"><button type="button" class="tab-btn ' + (ui.billingTab !== 'quotes' ? 'active' : '') + '" data-action="billing-tab" data-tab="invoices">📄 Facturas (' + invoices.length + ')</button><button type="button" class="tab-btn ' + (ui.billingTab === 'quotes' ? 'active' : '') + '" data-action="billing-tab" data-tab="quotes">📝 Presupuestos (' + quotes.length + ')</button></div>';

      html += '<div class="kpi-grid">';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#dcfce7">💰</div><div><b>' + money(totalPaid) + '</b><span>Cobrado</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fef3c7">⏳</div><div><b>' + money(totalUnpaid) + '</b><span>Pendiente</span><small>' + unpaid.length + ' facturas</small></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#e0f2fe">📄</div><div><b>' + invoices.length + '</b><span>Total facturas</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#ede9fe">📝</div><div><b>' + quotes.length + '</b><span>Presupuestos</span></div></div>';
      html += '</div>';

      if (ui.billingTab === 'quotes') {
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + quotes.length + ' presupuesto' + (quotes.length !== 1 ? 's' : '') + '</span><button class="btn btn-primary" data-action="new-quote">＋ Nuevo presupuesto</button></div>';
        if (!quotes.length) {
          html += emptyState('📝', 'Sin presupuestos', 'Crea presupuestos para enviar a tus clientes.');
        } else {
          html += '<div style="display:flex;flex-direction:column;gap:10px">';
          quotes.forEach(q => {
            const client = api.getClient(q.clientId);
            const st = QUOTE_STATUS[q.status];
            html += '<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:0"><div style="flex:1;min-width:220px"><div style="font-weight:700">' + esc(q.number) + '</div><div style="color:var(--muted);font-size:13px;margin-top:3px">🏢 ' + esc(client ? client.name : '—') + ' · ' + fmtDate(q.createdAt) + '</div><div style="font-size:15px;font-weight:800;margin-top:6px">' + money(q.total) + '</div></div><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span><button class="btn btn-ghost btn-sm" data-action="view-quote" data-id="' + q.id + '">Abrir</button></div>';
          });
          html += '</div>';
        }
        return html;
      }

      // Invoices tab
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + invoices.length + ' factura' + (invoices.length !== 1 ? 's' : '') + '</span><button class="btn btn-primary" data-action="new-invoice">＋ Nueva factura</button></div>';

      if (!invoices.length) {
        html += emptyState('📄', 'Sin facturas', 'Crea una factura manualmente o desde un servicio validado.');
      } else {
        html += '<div class="card table-card"><table><thead><tr><th>Número</th><th>Cliente</th><th>Emisión</th><th>Vencimiento</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>';
        invoices.sort((a, b) => b.issueDate.localeCompare(a.issueDate)).forEach(inv => {
          const client = api.getClient(inv.clientId);
          const st = INVOICE_STATUS[inv.status];
          html += '<tr><td style="font-weight:700">' + esc(inv.number) + '</td><td>' + esc(client ? client.name : '—') + '</td><td>' + fmtDate(inv.issueDate) + '</td><td>' + fmtDate(inv.dueDate) + '</td><td style="font-weight:700">' + money(inv.total) + '</td><td><span class="status-pill" style="background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span></td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-action="view-invoice" data-id="' + inv.id + '">Ver</button></td></tr>';
        });
        html += '</tbody></table></div>';
      }

      return html;
    }

    /* ===== REPORTS ===== */
    function renderReports() {
      if (!api.hasPermission('reports')) return emptyState('🔒', 'Sin permisos', 'No tienes acceso a reportes.');

      const stats = api.reportStats(ui.reportFrom, ui.reportTo);

      let html = '<div class="card"><h3 style="margin:0 0 10px">📊 Periodo del reporte</h3><div class="filter-bar"><label style="margin:0">Desde:</label><input type="date" data-change="report-from" value="' + esc(ui.reportFrom) + '"><label style="margin:0">Hasta:</label><input type="date" data-change="report-to" value="' + esc(ui.reportTo) + '"><button class="btn btn-ghost btn-sm" data-action="report-range" data-range="month">Este mes</button><button class="btn btn-ghost btn-sm" data-action="report-range" data-range="quarter">Trimestre</button><button class="btn btn-ghost btn-sm" data-action="report-range" data-range="year">Año</button></div><div class="action-row"><button class="btn btn-primary" data-action="export-report" data-format="csv">⬇ Exportar CSV</button><button class="btn btn-ghost" data-action="export-report" data-format="pdf">⬇ Exportar PDF</button></div></div>';

      html += '<div class="kpi-grid">';

      html += '<div class="kpi"><div class="kpi-ico" style="background:#dcfce7">✅</div><div><b>' + stats.completionRate.toFixed(0) + '%</b><span>Tasa de éxito</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#bbf7d0">💶</div><div><b>' + money(stats.revenue) + '</b><span>Ingresos servicios</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fef3c7">📄</div><div><b>' + money(stats.invoicedTotal) + '</b><span>Facturado</span><small>Cobrado: ' + money(stats.paidTotal) + '</small></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fee2e2">⏳</div><div><b>' + money(stats.outstandingTotal) + '</b><span>Pendiente de cobro</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#ede9fe">⚠️</div><div><b>' + stats.incidents + '</b><span>Incidencias</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#f0fdf4">⭐</div><div><b>' + stats.avgRating + '</b><span>Valoración media</span></div></div>';
      html += '<div class="kpi"><div class="kpi-ico" style="background:#fef3c7">❌</div><div><b>' + stats.canceled + '</b><span>Cancelados</span></div></div>';
      html += '</div>';

      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="grid2">';
      html += '<div class="card"><h3 style="margin:0 0 12px">👥 Rendimiento por empleado</h3><table><thead><tr><th>Empleado</th><th>Servicios</th><th>Ingresos</th></tr></thead><tbody>';
      if (!stats.byEmployee.length) html += '<tr><td colspan="3" class="empty-note">Sin datos en el periodo</td></tr>';
      stats.byEmployee.sort((a, b) => b.revenue - a.revenue).forEach(e => { html += '<tr><td>' + esc(e.name) + '</td><td>' + e.count + '</td><td>' + money(e.revenue) + '</td></tr>'; });
      html += '</tbody></table></div>';

      html += '<div class="card"><h3 style="margin:0 0 12px">🏢 Top clientes</h3><table><thead><tr><th>Cliente</th><th>Servicios</th><th>Ingresos</th></tr></thead><tbody>';
      if (!stats.byClient.length) html += '<tr><td colspan="3" class="empty-note">Sin datos en el periodo</td></tr>';
      stats.byClient.sort((a, b) => b.revenue - a.revenue).slice(0, 10).forEach(c => { html += '<tr><td>' + esc(c.name) + '</td><td>' + c.count + '</td><td>' + money(c.revenue) + '</td></tr>'; });
      html += '</tbody></table></div>';
      html += '</div>';

      return html;
    }

    /* ===== CLIENTS ===== */
    function renderClients() {
      if (!api.hasPermission('clients')) return emptyState('🔒', 'Sin permisos', 'Sin acceso a clientes.');
      let clients = []; try { clients = api.list('clients'); } catch (e) {}
      if (!clients.length) return emptyState('🏢', 'Sin clientes', 'Añade tu primer cliente.', '<button class="btn btn-primary" data-action="new-client">＋ Añadir cliente</button>');
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + clients.length + ' cliente' + (clients.length !== 1 ? 's' : '') + '</span><button class="btn btn-primary" data-action="new-client">＋ Nuevo cliente</button></div><div class="card table-card"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Contacto</th><th>Dirección</th><th></th></tr></thead><tbody>' + clients.map(c => '<tr><td style="font-weight:600">' + esc(c.name) + '<br><small style="color:var(--muted)">' + esc(c.taxId || '') + '</small></td><td>' + esc(c.type) + '</td><td>' + esc(c.phone) + '<br><small style="color:var(--muted)">' + esc(c.email || '') + '</small></td><td style="color:var(--muted);font-size:13px">' + esc(c.address) + '</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-action="edit-client" data-id="' + c.id + '">✏️</button> <button class="btn btn-danger btn-sm" data-action="delete-client" data-id="' + c.id + '">🗑</button></td></tr>').join('') + '</tbody></table></div>';
    }

    function renderEmployees() {
      if (!api.hasPermission('employees')) return emptyState('🔒', 'Sin permisos', 'Sin acceso a personal.');
      let employees = []; try { employees = api.list('employees'); } catch (e) {}
      if (!employees.length) return emptyState('👥', 'Sin personal', 'Registra empleados.', '<button class="btn btn-primary" data-action="new-employee">＋ Añadir empleado</button>');
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><span style="color:var(--muted);font-weight:600">' + employees.length + ' empleado' + (employees.length !== 1 ? 's' : '') + '</span><button class="btn btn-primary" data-action="new-employee">＋ Nuevo empleado</button></div><div class="card table-card"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Zona</th><th>Especialidad</th><th></th></tr></thead><tbody>' + employees.map(e => '<tr><td style="font-weight:600">' + esc(e.name) + '</td><td>' + esc(e.phone) + '</td><td>' + esc(e.zone) + '</td><td>' + esc(e.specialty || '—') + '</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-action="edit-employee" data-id="' + e.id + '">✏️</button> <button class="btn btn-danger btn-sm" data-action="delete-employee" data-id="' + e.id + '">🗑</button></td></tr>').join('') + '</tbody></table></div>';
    }

    /* ===== SERVICE DETAIL ===== */
    function serviceDetailHTML(svc) {
      const user = api.getUser();
      const client = api.getClient(svc.clientId);
      const employee = api.getEmployee(svc.employeeId);
      const st = STATUS_MAP[svc.status];
      const canEdit = canEditService(svc);
      const isStaff = user.role === 'staff';
      const isAdmin = ['admin', 'manager'].includes(user.role);
      const isClient = user.role === 'client';

      const tabs = [
        { id: 'resumen', label: '📋 Resumen' },
        { id: 'checkin', label: '📍 Check-in' },
        { id: 'tasks', label: '✅ Tareas (' + (svc.tasks || []).filter(t => t.done).length + '/' + (svc.tasks || []).length + ')' },
        { id: 'evidence', label: '📷 Evidencia' },
        { id: 'signature', label: '✍️ Firma' },
        { id: 'chat', label: '💬 Chat' },
        { id: 'qr', label: '🔳 QR' }
